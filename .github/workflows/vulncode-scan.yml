name: VulnCode AI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep>=1.100,<2"

      - name: Scan repository
        run: semgrep scan --config p/owasp-top-ten --json --output semgrep.json .

      - name: Upload normalized findings
        env:
          VULNCODE_API_URL: ${{ vars.VULNCODE_API_URL }}
          VULNCODE_INGEST_TOKEN: ${{ secrets.VULNCODE_INGEST_TOKEN }}
          VULNCODE_INSTALLATION_ID: ${{ vars.VULNCODE_INSTALLATION_ID }}
        run: python scripts/upload_semgrep.py semgrep.json

      - name: Preserve raw scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ github.sha }}
          path: semgrep.json
          if-no-files-found: error
